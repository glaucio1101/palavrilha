name: Deploy to GitHub Pages

# Publica o conteúdo do repositório no GitHub Pages a cada push na branch main.
# No repositório, ative: Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Só um deploy por vez; não cancela um que já está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve a pasta inteira. index.html está na raiz.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
